<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="icon" href="/logo.png" sizes="192x192">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <title>聯絡 Spotx Studio | 專案諮詢與報價 | Gabriel Chiu</title>

    <meta name="description" content="聯絡 Gabriel Chiu (Spotx Studio)。提供 B2B 系統設計、網頁前端開發與 UI/UX 顧問服務。立即填寫表單，我們將在 24 小時內回覆您的專案需求。">
    <meta name="keywords" content="聯絡 Spotx Studio, 詢價, UI/UX 設計報價, 網頁設計接案, 台北設計師, Gabriel Chiu, 專案合作">

    <meta property="og:site_name" content="Spotx Studio">
    <meta property="og:title" content="聯絡 Spotx Studio | 開始您的專案">
    <meta property="og:description" content="無論是 UI/UX 設計需求或網頁開發，歡迎隨時聯繫，讓我們一起打造出色的數位產品。">
    
    <meta property="og:image" content="https://spotx.studio/logo.png">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spotx.studio/zh/contact/">

    <script src="https://www.google.com/recaptcha/api.js?render=6Lf3w6QrAAAAAIMB8cAbfqtQ1i43SGcokERzGIgR"></script>
</head>
<body>
    <script>
        function onSubmit(token) {
            document.getElementById("contact-form").submit();
        }
    </script>
    
    <div class="navbar sticky-top p-0">
        <div class="container p-0 container px-3 py-3 px-sm-6 py-lg-5 px-xl-9 p-0">
            <a class="navbar-brand d-flex align-items-center flex-grow-1 flex-lg-grow-0" href="/zh/">
                <img src="../../media/logo.svg" alt="" width="30" height="24" class="me-2">
                <p class="h4 f-700 text-center">Spotx Studio</p>
            </a>
            <ul class="navbar-nav d-none d-lg-flex flex-row">
                <li class="nav-item"><a href="/zh/" class="nav-link">首頁</a></li>
                <li class="nav-item"><a href="/zh/about/" class="nav-link">關於</a></li>
                <li class="nav-item"><a href="/zh/case/" class="nav-link">作品</a></li>
                <li class="nav-item"><a href="/zh/contact/" class="nav-link active">聯絡</a></li>
            </ul>
            <div class="d-flex align-items-center gap-4">
                <div class="dropdown">    
                    <a class="btn btn-secondary dropdown-toggle d-flex align-items-center p2" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <img class="dropdown-icon me-2" src="../../media/icons/lang.svg" alt="">
                        <span id="current-lang-text">ZH</span> 
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/contact/" id="lang-en">English</a></li>
                        <li><a class="dropdown-item" href="/zh/contact/" id="lang-zh">繁體中文</a></li>
                    </ul>
                </div>
                <a class="btn btn-primary d-none d-lg-block" href="/zh/contact/" role="button">預約諮詢</a>
                <a class="hamburger d-lg-none" href="#"><img src="../../media/icons/hamburger.svg" alt=""></a>
            </div>
        </div>
    </div>

    <div class="container px-4 px-sm-6 px-lg-0">
        <div class="welcome-section py-8 py-lg-10">
            <div class="headline mb-6 m-lg-0 f-700 d-flex align-items-end col-span-lg-8 col-span-xl-12"><span>從<bold>這裡</bold>開始</span></div>
            <div class="p f-300 mb-6 m-lg-0 col-span-lg-6 col-span-xl-7">無論您是尋找 UI/UX 設計師、前端開發支援，或是尋求長期的設計合作夥伴，歡迎填寫表單，我將在 24 小時內與您聯繫。</div>
            <a href="../../media/cv.pdf" target="_blank" class="btn btn-secondary col-span-lg-8 col-span-xl-12">下載履歷</a>
        </div>
        
        <form class="mb-10 grid" id="contact-form">
            <div class="input-group d-flex flex-column col-span-xs-4 col-span-lg-3 col-span-xl-5 ">
                <label for="name" class="form-label">您的姓名</label>
                <input type="text" class="form-control p" id="name" name="name" placeholder="王小明" aria-describedby="" required>
            </div>
            <div class="input-group d-flex flex-column col-span-xs-4 col-span-lg-3 col-span-xl-5">
                <label for="company" class="form-label">公司名稱</label>
                <input type="text" class="form-control p" id="company" name="company" placeholder="ABC 科技有限公司" aria-describedby="">
            </div>
            <div class="input-group d-flex flex-column col-span-xs-4 col-span-lg-3 col-span-xl-5">
                <label for="email" class="form-label">電子郵件</label>
                <input type="email" class="form-control p" id="email" name="email" placeholder="example@gmail.com" aria-describedby="emailHelp" required>
            </div>
            <div class="input-group d-flex flex-column col-span-xs-4 col-span-lg-3 col-span-xl-5">
                <label for="location" class="form-label">地點</label>
                <input type="text" class="form-control p" id="location" name="location" placeholder="台北" aria-describedby="locationHelp">
            </div>
            
            <div class="input-group d-flex flex-column col-span-xs-4 col-span-md-8 col-span-lg-6 col-span-xl-10">
                <label class="form-label">您需要的服務</label>
                <div class="d-flex flex-column d-md-flex flex-md-row checkbox-container">
                    <div class="form-check flex-grow-1">
                        <input type="checkbox" class="btn-check" id="UIUX" name="UIUX">
                        <label class="form-check-label d-flex align-items-center" for="UIUX">
                            <div class="check-img me-3"></div>
                            <div class="p">UI/UX 設計</div>
                        </label>
                    </div>
                    <div class="form-check flex-grow-1">
                        <input type="checkbox" class="btn-check" id="Dev" name="Dev">
                        <label class="form-check-label d-flex align-items-center" for="Dev">
                            <div class="check-img me-3"></div>
                            <div class="p">前端網頁開發</div>
                        </label>
                    </div>
                    <div class="form-check flex-grow-1">
                        <input type="checkbox" class="btn-check" id="Graphic" name="Graphic">
                        <label class="form-check-label d-flex align-items-center" for="Graphic">
                            <div class="check-img me-3"></div>
                            <div class="p">平面設計</div>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="input-group d-flex flex-column col-span-xs-4 col-span-md-8 col-span-lg-6 col-span-xl-10">
                <label for="comments" class="form-label">請簡述您的需求或專案細節</label>            
                <textarea class="form-control p" placeholder="例如：專案類型、預算範圍、預計時程..." id="comments" name="comments"></textarea>
            </div>
            
            <div class="input-group d-flex flex-column d-none">
                <label for="website">請留空此欄位</label>
                <input type="text" id="website" name="website" autocomplete="off" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary col-span-lg-8" >發送訊息</button>
        </form>
    </div>

    <div class="footer d-flex">
        <div class="container d-flex">
            <span class="caption f-300">2025</span>
            <img src="../../media/icons/copyright.svg" alt="copyright icon" class="icon">
            <span class="caption f-300">© Spotx Studio 版權所有</span>
        </div>
    </div>

    <div class="side-menu container">
        <a href="/zh/" class="d-flex p-6 align-items-center">
            <h4 class="f-300 flex-grow-1">首頁</h4>
            <img src="../../media/icons/arrow-grey.svg" alt="" class="icon">
        </a>
        <a href="/zh/about/" class="d-flex p-6 align-items-center">
            <h4 class="f-300 flex-grow-1">關於</h4>
            <img src="../../media/icons/arrow-grey.svg" alt="" class="icon">
        </a>
        <a href="/zh/case/" class="d-flex p-6 align-items-center">
            <h4 class="f-300 flex-grow-1">作品</h4>
            <img src="../../media/icons/arrow-grey.svg" alt="" class="icon">
        </a>
        <a href="/zh/contact/" class="d-flex p-6 align-items-center">
            <h4 class="f-300 flex-grow-1">聯絡我</h4>
            <img src="../../media/icons/arrow-grey.svg" alt="" class="icon">
        </a>
    </div>
    <div class="overlay"></div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="../../js/offcanvas-custom.js"></script>
    <script src="../../js/form-submission.js"></script>
    <script src="../../js/language-switch.js"></script>
</body>
</html>
